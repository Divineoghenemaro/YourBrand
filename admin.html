<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Your Brand – Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="index.html"
          ><span class="mark"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#04231a"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 17l5-6 4 3 7-9" /></svg></span
          >Your Brand</a
        >
        <nav id="nav" aria-label="Main">
          <a href="index.html#markets">Markets</a>
          <a href="index.html#plans">Plans</a>
          <a href="index.html#how">How it works</a>
          <a href="index.html#why">Why us</a>
        </nav>
        <div class="sp"></div>
        <button
          class="icon"
          id="theme"
          aria-label="Toggle light and dark theme"
        >
          <svg
            class="moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z" />
          </svg>
          <svg
            class="sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
        <button class="btn ghost" id="signout">Sign out</button>
        <button
          class="icon menu"
          id="burger"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </header>
    <main class="page wide" id="adm">
      <h1>Admin dashboard</h1>
      <p class="sub">Signed in as <b id="adm-me"></b>. Manage registered users.</p>

      <div class="stats">
        <div class="stat"><b id="s-total">0</b><span>Total users</span></div>
        <div class="stat"><b id="s-ver">0</b><span>Verified</span></div>
        <div class="stat"><b id="s-unv">0</b><span>Awaiting verification</span></div>
        <div class="stat"><b id="s-new">0</b><span>Joined in last 7 days</span></div>
      </div>

      <div class="toolbar">
        <input id="q" type="search" placeholder="Search name, email or phone" aria-label="Search users" />
        <select id="flt" aria-label="Filter by status">
          <option value="all">All users</option>
          <option value="verified">Verified</option>
          <option value="pending">Awaiting verification</option>
        </select>
      </div>

      <div class="tbl">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="err" id="e-adm" role="alert"></div>
    </main>

    <a
      class="support"
      href="https://t.me/YOUR_TELEGRAM_USERNAME"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contact support on Telegram"
      title="Contact support on Telegram"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.9 4.3a1.2 1.2 0 0 0-1.2-.2L2.6 11.1c-1.2.5-1.2 1.2-.2 1.5l4.6 1.4 1.8 5.5c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.5.2 1.8-.8l3.3-15.5c.3-1.2-.4-1.7-1.1-1.5zM8.4 13.4l9.6-6c.5-.3.9-.1.5.2l-7.9 7.1-.3 3.4-1.9-4.7z" />
      </svg>
    </a>
    <script src="script.js"></script>
  </body>
</html>

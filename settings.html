<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Brand — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="trade-app">
<header>
  <div class="bar">
    <a class="brand" href="account.html"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#04231a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3 7-9"/></svg></span>Your Brand</a>
    <div class="sp"></div>
    <div class="app-actions">
      <button class="icon" id="theme" aria-label="Toggle light and dark theme">
<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>
<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
      <a href="settings.html" aria-label="Profile and settings" class="av sm" id="profile-chip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4.4"/><path d="M3.2 24c0-5.2 3.9-8.6 8.8-8.6s8.8 3.4 8.8 8.6z"/></svg><img alt="" hidden></a>
    </div>
  </div>
</header>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="side-user" href="settings.html" title="Profile">
      <span class="av md" ><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4.4"/><path d="M3.2 24c0-5.2 3.9-8.6 8.8-8.6s8.8 3.4 8.8 8.6z"/></svg><img alt="" hidden></span>
      <div class="meta"><b id="side-name">Trader</b><small id="side-email"></small></div>
    </a>
    <div class="side-nav" role="navigation" aria-label="Account">
      <a href="account.html" title="Dashboard"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg></span><span class="lbl">Dashboard</span></a>
      <a href="markets.html" title="Markets"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/><path d="M3 21h18"/></svg></span><span class="lbl">Markets</span></a>
      <a href="trade.html" title="Trade"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4"/><path d="M3 8l4-4 4 4"/><path d="M17 4v16"/><path d="M13 16l4 4 4-4"/></svg></span><span class="lbl">Trade</span></a>
      <a href="portfolio.html" title="Portfolio"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7.8 4.5"/></svg></span><span class="lbl">Portfolio</span></a>
      <a href="orders.html" title="Orders"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg></span><span class="lbl">Orders</span></a>
      <a href="history.html" title="History"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.4"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg></span><span class="lbl">History</span></a>
      <a class="active" href="settings.html" title="Settings"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></span><span class="lbl">Settings</span></a>
      <a href="admin.html" title="Admin" data-admin hidden><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span class="lbl">Admin</span></a>
    </div>
    <button class="side-signout" id="signout" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg><span class="lbl">Sign out</span></button>
  </aside>
  <main class="app-main" id="trade-page">
    <div class="page-head">
      <div><h1>Settings</h1><p class="lead">Your profile and security.</p></div>
      
    </div>
    <section class="panel glow">
      <div class="panel-head"><h2>Profile</h2></div>
      <div class="av-row">
        <span class="av xl" id="settings-avatar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4.4"/><path d="M3.2 24c0-5.2 3.9-8.6 8.8-8.6s8.8 3.4 8.8 8.6z"/></svg><img alt="" hidden></span>
        <div>
          <div class="btns">
            <button class="btn" id="avatar-pick" type="button">Upload photo</button>
            <button class="btn ghost" id="avatar-remove" type="button" hidden>Remove</button>
          </div>
          <input id="avatar-file" type="file" accept="image/*" hidden>
          <div class="err" id="e-avatar" role="status" style="margin-top:10px"></div>
        </div>
      </div>
      <form id="f-prof" style="margin-top:14px">
        <div class="form-grid">
          <div><label for="a-fn">First name</label><input id="a-fn" autocomplete="given-name"></div>
          <div><label for="a-ln">Last name</label><input id="a-ln" autocomplete="family-name"></div>
        </div>
        <label for="a-ph">Phone</label><input id="a-ph" type="tel" autocomplete="tel">
        <label for="a-email">Email</label><input id="a-email" disabled>
        <div class="err" id="e-prof" role="status"></div>
        <button class="btn" type="submit">Save changes</button>
      </form>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Password</h2></div>
      <form id="f-pass">
        <label for="a-cur">Current password</label><input id="a-cur" type="password" autocomplete="current-password">
        <div class="form-grid">
          <div><label for="a-new">New password</label><input id="a-new" type="password" autocomplete="new-password"></div>
          <div><label for="a-new2">Confirm new password</label><input id="a-new2" type="password" autocomplete="new-password"></div>
        </div>
        <div class="err" id="e-pass" role="status"></div>
        <button class="btn" type="submit">Update password</button>
      </form>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Account</h2></div>
      <div class="head-actions">
        <a class="btn ghost" href="admin.html" data-admin hidden>Admin panel</a>
        <button class="btn danger" id="a-del" type="button">Delete account</button>
      </div>
    </section>
  </main>
</div>
<div class="tab-bar" role="navigation" aria-label="Account">
  <a href="account.html"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg></span><span>Home</span></a>
  <a href="markets.html"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/><path d="M3 21h18"/></svg></span><span>Markets</span></a>
  <a href="trade.html"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4"/><path d="M3 8l4-4 4 4"/><path d="M17 4v16"/><path d="M13 16l4 4 4-4"/></svg></span><span>Trade</span></a>
  <a href="portfolio.html"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7.8 4.5"/></svg></span><span>Portfolio</span></a>
  <a class="active" href="settings.html"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></span><span>Account</span></a>
  
</div>
<script src="script.js"></script><script src="dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Your Brand – Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="index.html"
          ><span class="mark"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#04231a"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 17l5-6 4 3 7-9" /></svg></span
          >Your Brand</a
        >
        <nav id="nav" aria-label="Main">
          <a href="index.html#markets">Markets</a>
          <a href="index.html#plans">Plans</a>
          <a href="index.html#how">How it works</a>
          <a href="index.html#why">Why us</a>
          
        </nav>
        <div class="sp"></div>
        <button
          class="icon"
          id="theme"
          aria-label="Toggle light and dark theme"
        >
          <svg
            class="moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z" />
          </svg>
          <svg
            class="sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
        <button class="btn ghost" id="signout">Sign out</button>
        <button
          class="icon menu"
          id="burger"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </header>

    <main class="page" id="acct">
      <h1 id="hello">Hello</h1>
      <p class="sub">
        <b id="a-email"></b> · Member since <span id="a-since"></span> ·
        <a class="link" id="a-admin" href="admin.html" hidden>Admin panel</a>
      </p>
      <div class="grid2">
        <section class="card">
          <h2>Profile</h2>
          <form id="f-prof" novalidate>
            <label for="a-fn">First name</label><input id="a-fn" autocomplete="given-name" />
            <label for="a-ln">Last name</label><input id="a-ln" autocomplete="family-name" />
            <label for="a-ph">Phone</label><input id="a-ph" type="tel" autocomplete="tel" />
            <div class="err" id="e-prof" role="alert"></div>
            <button class="btn" type="submit">Save changes</button>
          </form>
        </section>
        <section class="card">
          <h2>Change password</h2>
          <form id="f-pass" novalidate>
            <label for="a-cur">Current password</label><div class="password-wrap"><input id="a-cur" type="password" autocomplete="current-password" placeholder="Current password" /><button type="button" class="password-toggle" aria-label="Show password"></button></div>
            <label for="a-new">New password</label><div class="password-wrap"><input id="a-new" type="password" autocomplete="new-password" placeholder="At least 8 characters" /><button type="button" class="password-toggle" aria-label="Show password"></button></div>
            <label for="a-new2">Confirm new password</label><div class="password-wrap"><input id="a-new2" type="password" autocomplete="new-password" placeholder="Re-enter new password" /><button type="button" class="password-toggle" aria-label="Show password"></button></div>
            <div class="err" id="e-pass" role="alert"></div>
            <button class="btn" type="submit">Update password</button>
          </form>
        </section>
      </div>
      <section class="card danger-zone">
        <h2>Delete account</h2>
        <p class="sub">This permanently removes your account.</p>
        <button class="btn danger" id="a-del" type="button">Delete my account</button>
      </section>
    </main>

    <a
      class="support"
      href="https://t.me/YOUR_TELEGRAM_USERNAME"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contact support on Telegram"
      title="Contact support on Telegram"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.9 4.3a1.2 1.2 0 0 0-1.2-.2L2.6 11.1c-1.2.5-1.2 1.2-.2 1.5l4.6 1.4 1.8 5.5c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.5.2 1.8-.8l3.3-15.5c.3-1.2-.4-1.7-1.1-1.5zM8.4 13.4l9.6-6c.5-.3.9-.1.5.2l-7.9 7.1-.3 3.4-1.9-4.7z" />
      </svg>
    </a>

    <script src="script.js"></script>
  </body>
</html>
